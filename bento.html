<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #f5efe6 0%, #e8e0d6 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .bento {
            width: min(100%, 1100px);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: repeat(2, minmax(180px, 1fr));
            grid-template-areas:
                "featured tall small"
                "featured wide small";
            gap: 18px;
        }

        .tile {
            min-height: 180px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(0, 0, 0, 0.06);
            padding: 24px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .featured {
            grid-area: featured;
            min-height: 378px;
        }

        .tall {
            grid-area: tall;
        }

        .small {
            grid-area: small;
            min-height: 378px;
        }

        .wide {
            grid-area: wide;
        }

        @media (max-width: 700px) {
            .bento {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                grid-template-areas:
                    "featured"
                    "tall"
                    "wide"
                    "small";
            }

            .featured,
            .small {
                min-height: 240px;
            }
        }
    </style>
</head>
<body>
    <main class="bento" aria-label="Bento box layout">
        <section class="tile featured">Featured</section>
        <section class="tile tall">Tall</section>
        <section class="tile small">Small</section>
        <section class="tile wide">Wide</section>
    </main>
</body>
</html>
