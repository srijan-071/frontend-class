<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background Demo</title>
    <style>
       div{
        width: 500px;
        height: 500px;
        border: 10px solid black;
        background-image: url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=500&h=500');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
       }
       img{
        display: block;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
       }
    </style>
</head>
<body>
    <div>
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300" alt="Mountain Image" width="300" height="200">
    </div>
</body>
</html>
