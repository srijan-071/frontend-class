<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            min-height: 200px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-weight: 600;
        }

        .card.red {
            background: red;
        }

        .card.blue {
            background: blue;
        }

        .card.green {
            background: green;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="card red">Red</div>
        <div class="card blue">Blue</div>
        <div class="card green">Green</div>
    </main>
</body>
</html>
