<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Grid</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            min-height: 200px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-weight: 600;
            padding: 20px;
            text-align: center;
        }

        .card.red {
            background: red;
        }

        .card.blue {
            background: blue;
        }

        .card.green {
            background: green;
        }

        @media (max-width: 420px) {
            .container {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>
    <main class="container" aria-label="Color card grid">
        <article class="card red">Red</article>
        <article class="card blue">Blue</article>
        <article class="card green">Green</article>
    </main>
</body>
</html>
